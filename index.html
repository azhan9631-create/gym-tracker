<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Gym Tracker</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#273449;--text:#f1f5f9;--muted:#94a3b8;--green:#22c55e;--blue:#3b82f6;--gold:#facc15;--fire:#fb923c;--fs:16px}
*{box-sizing:border-box}
body{margin:0 auto;padding:16px;max-width:520px;min-height:100vh;font-family:system-ui,sans-serif;font-size:var(--fs);color:var(--text);background:linear-gradient(#0f172a,#111827)}
h1{font-size:1.3em;margin:0}
h2{font-size:1em;margin:22px 0 8px;color:#93c5fd;text-transform:uppercase;letter-spacing:.05em}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card{background:var(--card);padding:14px;border-radius:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.muted{color:var(--muted);font-size:.9em}
select,input,button{font-size:var(--fs);padding:12px;border-radius:12px;border:none;width:100%;margin-top:8px;font-family:inherit}
select,input{background:var(--card2);color:var(--text)}
button{background:var(--blue);color:#fff;font-weight:600;cursor:pointer}
button:active{transform:scale(.97)}
button.green{background:var(--green);color:#052e16}
button.icon{width:auto;padding:8px 14px;margin:0 0 0 6px;background:var(--card2)}
button.ghost{background:var(--card2);font-weight:500}
.row{display:flex;gap:8px}
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#7c2d12,#1e293b)}
.flame{font-size:3em;filter:grayscale(1) opacity(.5)}
.flame.on{filter:none;animation:flick 1.6s infinite}
@keyframes flick{50%{transform:scale(1.1) rotate(-4deg)}}
.big{font-size:2.6em;font-weight:800;line-height:1}
.total{margin-left:auto;text-align:right}
.total b{font-size:1.6em;display:block}
.week{display:flex;justify-content:space-between;margin-bottom:10px}
.day{text-align:center;flex:1}
.day span{display:flex;width:2em;height:2em;margin:0 auto 3px;border-radius:50%;background:var(--card2);align-items:center;justify-content:center;font-weight:800}
.day.done span{background:var(--green);color:#052e16}
.day.now span{outline:2px solid var(--gold)}
.day small{color:var(--muted)}
.goalrow{display:flex;justify-content:space-between;align-items:center}
.progress{height:10px;background:var(--card2);border-radius:99px;margin:10px 0;overflow:hidden}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--fire),var(--gold));transition:width .5s}
.line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #334155}
.best{color:var(--gold);margin-top:10px;font-weight:600}
.beat{color:var(--green);margin-top:4px;font-weight:600}
.msg{display:none;font-weight:600;border-left:5px solid var(--green);animation:pop .4s}
.msg.record{border-color:var(--gold);background:#3b2f08}
.msg.up{border-color:var(--green);background:#0b3320}
.msg.same{border-color:var(--blue)}
.msg.easy{border-color:#a78bfa}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.del{width:auto;padding:4px 12px;margin:0;background:#475569}
.hist b{color:#cbd5e1}
</style>
</head>
<body>
<div class="top">
  <h1>🏋️ Gym Tracker</h1>
  <button class="icon" id="fsBtn" title="Text size">Aa</button>
</div>

<div class="card hero">
  <div class="flame" id="flame">🔥</div>
  <div><div class="big" id="streakNum">0</div><div class="muted">week streak</div></div>
  <div class="total"><b id="totalDays">0</b><span class="muted">workout days</span></div>
</div>

<div class="card">
  <div class="week" id="week"></div>
  <div class="progress"><div id="bar"></div></div>
  <div class="goalrow">
    <span id="goalText"></span>
    <span><button class="icon" id="goalMinus">−</button><button class="icon" id="goalPlus">+</button></span>
  </div>
  <div class="muted" id="hello" style="margin-top:8px"></div>
</div>

<h2>Exercise</h2>
<div class="card">
  <select id="exercise"></select>
  <div class="row">
    <input id="newEx" placeholder="Add your own exercise">
    <button id="addEx" class="ghost" style="width:90px">Add</button>
  </div>
</div>

<h2>Last time</h2>
<div class="card" id="last"></div>

<h2>Log a set</h2>
<div class="card">
  <div class="row">
    <input id="weight" type="number" inputmode="decimal" step="0.5" placeholder="Weight kg (empty = bodyweight)">
    <input id="reps" type="number" inputmode="numeric" placeholder="Reps / minutes">
  </div>
  <button id="addSet" class="green">Add set</button>
</div>
<div class="card msg" id="msg"></div>

<h2>Today</h2>
<div class="card" id="todaySets"></div>

<h2>History</h2>
<div id="history" class="hist"></div>

<h2>Backup</h2>
<div class="card">
  <div class="muted">Your data lives only on this phone. Save a backup now and then.</div>
  <div class="row">
    <button class="ghost" id="exportBtn">Export</button>
    <button class="ghost" id="importBtn">Import</button>
  </div>
  <input type="file" id="importFile" accept=".json" hidden>
</div>

<script>
const LIB = {
  "💪 Chest": ["Bench Press","Incline Dumbbell Press","Chest Press Machine","Chest Fly Machine","Push-ups","Cable Crossover"],
  "🧗 Back": ["Lat Pulldown","Seated Cable Row","Barbell Row","Pull-ups","Deadlift","Back Extension"],
  "🦵 Legs": ["Squat","Leg Press Machine","Leg Extension Machine","Leg Curl Machine","Lunges","Romanian Deadlift","Calf Raise","Hip Thrust"],
  "🏔️ Shoulders": ["Overhead Press","Lateral Raise","Shoulder Press Machine","Face Pull","Rear Delt Fly"],
  "💥 Arms": ["Bicep Curl","Hammer Curl","Tricep Pushdown","Skull Crusher","Dips"],
  "🎯 Core": ["Plank","Crunches","Leg Raises","Russian Twist","Cable Crunch"],
  "🏃 Cardio": ["Treadmill","Stationary Bike","Rowing Machine","Elliptical","Walking"],
  "🌿 Easy & Balance": ["Chair Squat (sit-to-stand)","Wall Push-up","Seated Leg Raise","Step-ups","Resistance Band Row","Balance Stand","Seated Marching"]
};

const $ = id => document.getElementById(id);
const fmt = d => d.toLocaleDateString("en-CA");
const parse = s => new Date(s + "T00:00:00");
const today = fmt(new Date());
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
const pick = a => a[Math.floor(Math.random() * a.length)];

let logs = load("gymLogs", []);
let custom = load("gymCustom", []);
let settings = Object.assign({ goal: 3, big: false }, load("gymSettings", {}));

const save = () => {
  localStorage.setItem("gymLogs", JSON.stringify(logs));
  localStorage.setItem("gymCustom", JSON.stringify(custom));
  localStorage.setItem("gymSettings", JSON.stringify(settings));
};
const builtIn = Object.values(LIB).flat();
const allNames = () => [...custom, ...builtIn];

// Keep exercises from the older version
const oldList = load("gymExercises", null);
if (Array.isArray(oldList)) {
  oldList.forEach(n => { if (!allNames().includes(n)) custom.push(n); });
  localStorage.removeItem("gymExercises");
  save();
}

const setTxt = s => (s.weight > 0 ? s.weight + " kg" : "Bodyweight") + " × " + s.reps;

function monday(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - (x.getDay() + 6) % 7);
  return x;
}

function calcStreak() {
  const days = new Set(logs.map(l => l.date));
  const counts = {};
  days.forEach(s => { const k = fmt(monday(parse(s))); counts[k] = (counts[k] || 0) + 1; });
  const w = monday(new Date());
  const thisWeek = counts[fmt(w)] || 0;
  let streak = thisWeek >= settings.goal ? 1 : 0;
  w.setDate(w.getDate() - 7);
  while ((counts[fmt(w)] || 0) >= settings.goal) { streak++; w.setDate(w.getDate() - 7); }
  return { days, streak, thisWeek };
}

function renderStreak() {
  const { days, streak, thisWeek } = calcStreak();
  const g = settings.goal;
  $("streakNum").textContent = streak;
  $("flame").className = "flame" + (streak > 0 ? " on" : "");
  $("totalDays").textContent = days.size;
  const mon = monday(new Date());
  $("week").innerHTML = ["M","T","W","T","F","S","S"].map((n, i) => {
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    const k = fmt(d), done = days.has(k);
    return `<div class="day ${done ? "done" : ""} ${k === today ? "now" : ""}"><span>${done ? "✓" : ""}</span><small>${n}</small></div>`;
  }).join("");
  $("goalText").textContent = `Goal: ${g} workouts / week (${Math.min(thisWeek, g)}/${g})`;
  $("bar").style.width = Math.min(100, thisWeek / g * 100) + "%";
  const left = g - thisWeek;
  $("hello").textContent =
    thisWeek >= g ? "🎉 Weekly goal reached! Anything extra is a bonus." :
    thisWeek === 0 ? "Start today. One set is enough to begin 💪" :
    `${left} more workout${left > 1 ? "s" : ""} this week to ${streak ? "grow" : "start"} your streak.`;
}

function renderSelect() {
  const cur = $("exercise").value;
  const opts = a => a.map(e => `<option>${esc(e)}</option>`).join("");
  let h = Object.entries(LIB).map(([g, a]) => `<optgroup label="${g}">${opts(a)}</optgroup>`).join("");
  if (custom.length) h = `<optgroup label="⭐ My exercises">${opts(custom)}</optgroup>` + h;
  $("exercise").innerHTML = h;
  if (cur && allNames().includes(cur)) $("exercise").value = cur;
}

function lastSession(ex) {
  const past = logs.filter(l => l.exercise === ex && l.date !== today);
  if (!past.length) return null;
  const date = past.map(l => l.date).sort().pop();
  return { date, sets: past.filter(l => l.date === date) };
}

function renderLast() {
  const ex = $("exercise").value, p = lastSession(ex);
  if (!p) {
    $("last").innerHTML = '<span class="muted">First time with this one. Whatever you do today becomes the number to beat! 🌱</span>';
    return;
  }
  const ago = Math.round((parse(today) - parse(p.date)) / 864e5);
  const best = Math.max(...logs.filter(l => l.exercise === ex && l.date !== today).map(l => l.weight));
  $("last").innerHTML =
    `<div class="muted">${p.date} · ${ago === 1 ? "yesterday" : ago + " days ago"}</div>` +
    p.sets.map((s, i) => `<div class="line"><span>Set ${i + 1}</span><b>${setTxt(s)}</b></div>`).join("") +
    (best > 0 ? `<div class="best">🏆 Heaviest ever: ${best} kg</div>` : "") +
    `<div class="beat">Can you beat it today? 💪</div>`;
}

function prefill() {
  const ex = $("exercise").value, p = lastSession(ex);
  const mine = logs.filter(l => l.exercise === ex && l.date === today);
  const ref = (p && (p.sets[mine.length] || p.sets[p.sets.length - 1])) || mine[mine.length - 1];
  $("weight").value = ref ? ref.weight : "";
  $("reps").value = ref ? ref.reps : "";
}

function renderToday() {
  const sets = logs.filter(l => l.date === today);
  $("todaySets").innerHTML = sets.length
    ? sets.map(s => `<div class="line"><span>${esc(s.exercise)}: <b>${setTxt(s)}</b></span><button class="del" data-id="${s.id}">✕</button></div>`).join("")
    : '<span class="muted">Nothing logged yet today.</span>';
}

function renderHistory() {
  const dates = [...new Set(logs.map(l => l.date))].sort().reverse().slice(0, 10);
  $("history").innerHTML = dates.map(d => {
    const byEx = {};
    logs.filter(l => l.date === d).forEach(s => (byEx[s.exercise] = byEx[s.exercise] || []).push(s));
    return `<div class="card"><b>${d}</b>` + Object.entries(byEx).map(([ex, ss]) =>
      `<div style="margin-top:6px">${esc(ex)}<br><span class="muted">${ss.map(s => `${s.weight}×${s.reps}`).join(", ")}</span></div>`).join("") + `</div>`;
  }).join("") || '<div class="card muted">Your workouts will show up here.</div>';
}

function renderAll() { renderStreak(); renderLast(); renderToday(); renderHistory(); }

function feedback(w, r, prev, bestBefore) {
  if (!prev) return { type: "up", text: pick([
    "Great start! This is your baseline. Next time we beat it 🌱",
    "First entry saved. Every journey starts with one set 🚀"]) };
  const top = prev.sets.reduce((a, b) => (b.weight > a.weight || (b.weight === a.weight && b.reps > a.reps)) ? b : a);
  const topTxt = `Last time: ${setTxt(top)}.`;
  if (w > bestBefore && bestBefore > 0)
    return { type: "record", text: `🏆 NEW PERSONAL RECORD! ${w} kg is your heaviest ever. ${topTxt}` };
  if (w > top.weight)
    return { type: "up", text: `💪 +${+(w - top.weight).toFixed(2)} kg more than last time. You're getting stronger! ${topTxt}` };
  if (w === top.weight && r > top.reps)
    return { type: "up", text: `🔥 Same weight, +${r - top.reps} more rep${r - top.reps > 1 ? "s" : ""}. That's progress! ${topTxt}` };
  if (w === top.weight && r === top.reps)
    return { type: "same", text: `✅ You matched last time. ${pick(["Consistency builds strength.", "Solid and steady!", "Strong foundations."])} ${topTxt}` };
  return { type: "easy", text: `💚 ${pick(["A lighter day is fine. Showing up is what counts.", "Listening to your body is smart training.", "Every session counts, even the easy ones."])} ${topTxt}` };
}

function showMsg(m) {
  const el = $("msg");
  el.className = "card msg " + m.type;
  el.style.display = "block";
  el.textContent = m.text;
}

$("addSet").onclick = () => {
  const ex = $("exercise").value;
  const w = parseFloat($("weight").value) || 0;
  const r = parseInt($("reps").value);
  if (!(r > 0)) return alert("Please enter reps (or minutes).");
  const prev = lastSession(ex);
  const bestBefore = Math.max(0, ...logs.filter(l => l.exercise === ex).map(l => l.weight));
  const before = calcStreak();
  logs.push({ id: Date.now(), date: today, exercise: ex, weight: w, reps: r });
  save();
  const after = calcStreak();
  const m = feedback(w, r, prev, bestBefore);
  if (before.thisWeek < settings.goal && after.thisWeek >= settings.goal)
    m.text += ` 🎉 Weekly goal reached! Streak: ${after.streak}!`;
  else if (before.days.size < after.days.size)
    m.text += " 🔥 Workout day logged!";
  showMsg(m);
  renderAll();
  prefill();
};

$("todaySets").onclick = e => {
  const id = e.target.dataset.id;
  if (!id) return;
  logs = logs.filter(l => String(l.id) !== id);
  save(); renderAll(); prefill();
};

$("addEx").onclick = () => {
  const name = $("newEx").value.trim();
  if (!name || allNames().some(n => n.toLowerCase() === name.toLowerCase())) return;
  custom.push(name); save();
  $("newEx").value = "";
  renderSelect(); $("exercise").value = name; renderLast(); prefill();
};

$("exercise").onchange = () => { $("msg").style.display = "none"; renderLast(); prefill(); };

$("goalMinus").onclick = () => { settings.goal = Math.max(1, settings.goal - 1); save(); renderStreak(); };
$("goalPlus").onclick = () => { settings.goal = Math.min(7, settings.goal + 1); save(); renderStreak(); };

function applyFont() { document.documentElement.style.setProperty("--fs", settings.big ? "20px" : "16px"); }
$("fsBtn").onclick = () => { settings.big = !settings.big; save(); applyFont(); };

$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify({ logs, custom, settings })], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "gym-backup-" + today + ".json";
  a.click();
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!Array.isArray(d.logs)) throw 0;
      if (!confirm("Replace current data with this backup?")) return;
      logs = d.logs;
      custom = Array.isArray(d.custom) ? d.custom : [];
      settings = Object.assign(settings, d.settings || {});
      save(); applyFont(); renderSelect(); renderAll(); prefill();
    } catch (err) { alert("That file isn't a valid backup."); }
  };
  rd.readAsText(f);
};

applyFont();
renderSelect();
renderAll();
prefill();
</script>
</body>
</html>
